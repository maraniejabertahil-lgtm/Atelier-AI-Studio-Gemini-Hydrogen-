name: Athena adaptation checks

on:
  push:
    branches:
      - atelier-athena-5-5-adaptation
  pull_request:
    branches:
      - main

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run lint
      - name: Smoke-test Athena workspace tools
        run: bun run scripts/test-athena-workspace.ts
      - name: Build frontend
        run: bun run build
